name: Build APK (3 versions)

on:
  workflow_dispatch:
    inputs:
      create_release:
        type: choice
        description: 'Create a Release'
        options:
          - 'No'
          - 'Yes'
        default: 'No'
        required: true
      tag_name:
        type: string
        description: 'Release Tag (e.g. v1.0.0 - optional)'
        default: ''
        required: false
      release_title:
        type: string
        description: 'Release Title (e.g. Telegram Accessible v1.0 - optional)'
        default: ''
        required: false
      release_description:
        type: string
        description: 'Release Description (Change Log - optional; type \n for a new line)'
        default: ''
        required: false
      telegram_ref:
        type: string
        description: 'Telegram source version: a commit or branch. Default = the tested 13.2.2. Type master for the newest (the accessibility patch may not fit it yet)'
        default: '21f7d109da6ab3506c9e9577f98c6a38771ab335'
        required: false

# needed to create the release and upload the APKs to it
permissions:
  contents: write

jobs:
  # Runs first and quickly: a wrong or already used release tag is found now, not after the long builds.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check release settings
        if: ${{ inputs.create_release == 'Yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -e
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="v${GITHUB_RUN_NUMBER}"
            echo "No tag typed: the tag will be $TAG"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._+-]*$'; then
            echo "ERROR: the tag '$TAG' has characters that are not allowed. Use letters, digits, dot, dash or underscore."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: a release with the tag '$TAG' already exists. Type another tag, or delete that release first."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: the tag '$TAG' already exists in the repository. Type another tag, or delete that tag first."
            exit 1
          fi
          echo "Release tag '$TAG' is free."

  # Three builds in parallel: universal (all CPU types), arm64-v8a ("arm8a") and armeabi-v7a ("arm7").
  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: universal
            abi: ''
          - name: arm64-v8a
            abi: 'arm64-v8a'
          - name: armeabi-v7a
            abi: 'armeabi-v7a'

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: patches-repo

      # a11y-fork: cache key based on patch scripts, so a changed
      # apply-a11y.py / patches/* invalidates the Telegram clone cache.
      - name: Compute patches cache key
        id: patches_key
        env:
          TG_REF: ${{ inputs.telegram_ref }}
        run: |
          set -e
          KEY=$(find patches-repo/scripts patches-repo/patches -type f \( -name '*.py' -o -name '*.patch' -o -name '*.java' \) -print0 2>/dev/null \
                 | sort -z | xargs -0 cat 2>/dev/null | sha256sum | cut -c1-16)
          if [ -z "$KEY" ]; then KEY="nopatches"; fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Patches cache key: $KEY"
          # the cached clean clone is for one exact Telegram version; a branch name keeps moving, so it is never cached
          TG_REF="${TG_REF:-master}"
          if printf '%s' "$TG_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ref=$(printf '%s' "$TG_REF" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=branch-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi
          echo "Telegram source: $TG_REF"

      # The cache holds the CLEAN clone only (saved right after cloning, before any patch).
      # Saving the patched tree made a rebuild of the same scripts run apply-a11y.py twice
      # on the same files, which breaks some patches.
      - name: Restore Telegram clone cache
        id: cache_telegram
        uses: actions/cache/restore@v4
        with:
          path: telegram
          key: telegram-clean-${{ runner.os }}-${{ steps.patches_key.outputs.ref }}-${{ steps.patches_key.outputs.key }}

      - name: Clone Telegram with submodules
        if: steps.cache_telegram.outputs.cache-hit != 'true'
        env:
          TG_REF: ${{ inputs.telegram_ref }}
        run: |
          set -e
          TG_REF="${TG_REF:-master}"
          git init -q telegram
          cd telegram
          git remote add origin https://github.com/DrKLO/Telegram.git
          git fetch --depth 1 origin "$TG_REF"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='Telegram source: %h %ad %s' --date=short
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive
          if [ ! -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ] && [ ! -f TMessagesProj/lib/jlatexmath/build.gradle ]; then
            rm -rf TMessagesProj/lib/jlatexmath
            git clone --depth 1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          fi

      - name: Save clean Telegram clone to cache
        if: steps.cache_telegram.outputs.cache-hit != 'true' && matrix.name == 'universal'
        uses: actions/cache/save@v4
        with:
          path: telegram
          key: telegram-clean-${{ runner.os }}-${{ steps.patches_key.outputs.ref }}-${{ steps.patches_key.outputs.key }}

      # When the clone came from cache, submodules may be missing files if the
      # original clone was interrupted; refresh them just in case.
      - name: Ensure submodules after cache restore
        if: steps.cache_telegram.outputs.cache-hit == 'true'
        run: |
          set -e
          cd telegram
          git submodule sync --recursive || true
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive || true
          if [ ! -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ] && [ ! -f TMessagesProj/lib/jlatexmath/build.gradle ]; then
            rm -rf TMessagesProj/lib/jlatexmath
            git clone --depth 1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      # a11y-fork: cache Android NDK + CMake — downloading these is one of
      # the slowest parts of the job.
      - name: Cache Android NDK + CMake
        id: cache_ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-ndk-27.2.12479018-cmake-3.22.1-${{ runner.os }}

      - name: Install SDK components
        run: |
          set -e
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          if [ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            sdkmanager --install "ndk;27.2.12479018"
          else
            echo "NDK 27.2.12479018 restored from cache"
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            sdkmanager --install "cmake;3.22.1"
          else
            echo "CMake 3.22.1 restored from cache"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # a11y-fork: cache Gradle caches + wrapper. Huge speed-up on rebuilds.
      # The key includes the patches hash so the Gradle build cache is
      # invalidated when the applied source changes.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            telegram/.gradle
          key: gradle-${{ runner.os }}-${{ matrix.name }}-${{ steps.patches_key.outputs.key }}-${{ hashFiles('telegram/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.name }}-${{ steps.patches_key.outputs.key }}-
            gradle-${{ runner.os }}-${{ matrix.name }}-

      - name: Inject API credentials
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -e
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "ERROR: Set secrets TELEGRAM_API_ID and TELEGRAM_API_HASH"
            exit 1
          fi
          python3 patches-repo/scripts/inject-api.py

      - name: Wire jlatexmath module
        run: |
          set -e
          cd telegram
          if [ -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle ]; then
            JDIR="TMessagesProj/lib/jlatexmath/jlatexmath"
          elif [ -f TMessagesProj/lib/jlatexmath/build.gradle ]; then
            JDIR="TMessagesProj/lib/jlatexmath"
          else
            echo "ERROR: cannot locate jlatexmath build.gradle"
            exit 1
          fi
          if ! grep -q "include ':jlatexmath'" settings.gradle; then
            printf "\ninclude ':jlatexmath'\nproject(':jlatexmath').projectDir = new File(rootDir, '%s')\n" "$JDIR" >> settings.gradle
          fi

      - name: Apply a11y patches
        run: |
          set -e
          A11Y="patches-repo/scripts/apply-a11y.py"
          if [ ! -f "$A11Y" ]; then
            echo "ERROR: $A11Y not found in repo"
            exit 1
          fi
          if [ "$(wc -c < "$A11Y")" -lt 40000 ]; then
            echo "ERROR: $A11Y is truncated ($(wc -c < "$A11Y") bytes); expected > 40000 bytes."
            echo "Please upload the full apply-a11y.py to patches-repo/scripts/"
            exit 1
          fi
          echo "Using $A11Y ($(wc -c < "$A11Y") bytes)"

          shopt -s nullglob
          for f in patches-repo/patches/*.patch; do
            echo "Applying $f"
            git -C telegram apply --whitespace=nowarn "$PWD/$f" || git -C telegram apply -3 "$PWD/$f" || true
          done

          python3 patches-repo/scripts/apply-a11y.py
          # slim-arm64.py is not run here: the CPU type of each build is chosen by the matrix below

      - name: Unique package id + private signing (Play Protect)
        env:
          A11Y_KEYSTORE_BASE64: ${{ secrets.A11Y_KEYSTORE_BASE64 }}
          A11Y_STORE_PASSWORD: ${{ secrets.A11Y_STORE_PASSWORD }}
          A11Y_KEY_PASSWORD: ${{ secrets.A11Y_KEY_PASSWORD }}
          A11Y_KEY_ALIAS: ${{ secrets.A11Y_KEY_ALIAS }}
          A11Y_APP_PACKAGE: ${{ secrets.A11Y_APP_PACKAGE }}
        run: |
          set -e
          if [ -f "$PWD/patches-repo/scripts/prepare-release-signing.py" ]; then
            python3 "$PWD/patches-repo/scripts/prepare-release-signing.py"
          fi
          echo "--- App build.gradle signing / release snippet ---"
          grep -n "a11y-fork\|minifyEnabled\|storeFile\|applicationId\|APP_PACKAGE" telegram/TMessagesProj_App/build.gradle | head -40 || true
          grep -n "^APP_PACKAGE\|^RELEASE_" telegram/gradle.properties || true

      # Own package name (contains "shamloo"). It is set LAST, after prepare-release-signing.py, so
      # nothing can overwrite it. google-services.json must also know the package, otherwise the
      # google-services Gradle plugin stops the build with "No matching client found".
      # NOTE: a different package name installs as a separate app next to any older build.
      - name: Set package name (shamloo) and google-services entry
        env:
          A11Y_PACKAGE_NAME: com.shamloo.telegram.accessible
        run: |
          python3 - <<'PY'
          import copy, glob, json, os, re
          pkg = os.environ["A11Y_PACKAGE_NAME"]
          assert re.fullmatch(r"[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+", pkg), pkg
          gp = "telegram/gradle.properties"
          text = open(gp, encoding="utf-8").read()
          if re.search(r"^APP_PACKAGE=.*$", text, re.M):
              text = re.sub(r"^APP_PACKAGE=.*$", "APP_PACKAGE=" + pkg, text, flags=re.M)
          else:
              text += "\nAPP_PACKAGE=" + pkg + "\n"
          open(gp, "w", encoding="utf-8").write(text)
          print("APP_PACKAGE =", pkg)
          for gs in glob.glob("telegram/**/google-services.json", recursive=True):
              data = json.load(open(gs, encoding="utf-8"))
              clients = data.get("client", [])
              names = [c["client_info"]["android_client_info"]["package_name"] for c in clients]
              if pkg in names:
                  continue
              base = next((c for c in clients
                           if c["client_info"]["android_client_info"]["package_name"] == "org.telegram.messenger"), clients[0])
              new = copy.deepcopy(base)
              new["client_info"]["android_client_info"]["package_name"] = pkg
              clients.append(new)
              json.dump(data, open(gs, "w", encoding="utf-8"), indent=2)
              print("google-services entry added:", gs)
          PY
          grep -n "^APP_PACKAGE" telegram/gradle.properties

      - name: Warn if there is no fixed signing key
        env:
          A11Y_KEYSTORE_BASE64: ${{ secrets.A11Y_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$A11Y_KEYSTORE_BASE64" ]; then
            echo "::warning::A11Y_KEYSTORE_BASE64 is not set, so each of the three builds may be signed with a different key and you could not update from one to another. Save the keystore as that secret first."
          fi

      # Builds for one CPU type only: the app module keeps just that ABI, and the native library is built for it only.
      - name: Limit this build to one CPU type
        if: ${{ matrix.abi != '' }}
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import os, re
          abi = os.environ["ABI"]
          app = "telegram/TMessagesProj_App/build.gradle"
          t = open(app, encoding="utf-8").read()
          old = 'abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"'
          if t.count(old) < 1:
              raise SystemExit("ERROR: the abiFilters line was not found in TMessagesProj_App/build.gradle (Telegram changed it)")
          open(app, "w", encoding="utf-8").write(t.replace(old, 'abiFilters "%s"' % abi))
          print("app module: only", abi)
          lib = "telegram/TMessagesProj/build.gradle"
          s = open(lib, encoding="utf-8").read()
          m = re.search(r"^([ \t]*)arguments '-DANDROID_STL=c\+\+_static'[^\n]*\n", s, re.M)
          if m:
              s = s[:m.end()] + m.group(1) + 'abiFilters "%s"\n' % abi + s[m.end():]
              open(lib, "w", encoding="utf-8").write(s)
              print("native library: only", abi)
          else:
              print("NOTE: the native build line was not found; the library is built for every CPU type and only", abi, "is packaged")
          PY

      - name: Build APK
        working-directory: telegram
        run: |
          set -e
          chmod +x gradlew
          if ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon; then
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "Release failed — falling back to afatDebug"
            ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Find APK
        id: apk
        run: |
          set -e
          APK=$(find telegram -path "*outputs/apk*" -name "*.apk" | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: no APK found"
            find telegram -name "*.apk" 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          ls -lh "$APK"
          mkdir -p dist
          cp "$APK" "dist/telegram-accessible-${{ matrix.name }}.apk"
          echo "$BUILD_VARIANT" > "dist/variant-${{ matrix.name }}.txt"

      - name: Check the CPU types inside the APK
        env:
          WANT: ${{ matrix.abi }}
        run: |
          set -e
          FOUND=$(unzip -l "dist/telegram-accessible-${{ matrix.name }}.apk" | grep -oE 'lib/(armeabi-v7a|arm64-v8a|x86_64|x86)/' | sort -u | sed 's#lib/##; s#/##' | tr '\n' ' ')
          echo "CPU types in this APK: $FOUND"
          if [ -n "$WANT" ] && [ "$FOUND" != "$WANT " ]; then
            echo "ERROR: this build should contain only $WANT but contains: $FOUND"
            exit 1
          fi

      - name: Prepare Keystore File for Artifact
        if: ${{ always() && matrix.name == 'universal' }}
        run: |
          mkdir -p telegram/TMessagesProj/config
          KEYSTORE_FILE=$(find telegram -name "*.keystore" 2>/dev/null | head -n 1)
          if [ -n "$KEYSTORE_FILE" ] && [ -f "$KEYSTORE_FILE" ]; then
            echo "Found keystore at $KEYSTORE_FILE, copying to default path..."
            cp "$KEYSTORE_FILE" telegram/TMessagesProj/config/a11y-release.keystore
          else
            echo "No keystore found, generating placeholder to prevent workflow failure..."
            touch telegram/TMessagesProj/config/a11y-release.keystore
          fi

      - name: Upload keystore (save once as secret for updates)
        if: ${{ always() && matrix.name == 'universal' }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-release-keystore
          path: telegram/TMessagesProj/config/a11y-release.keystore
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-accessible-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Only when create_release = Yes and all three builds worked: one release with the three APKs.
  release:
    needs: build
    if: ${{ inputs.create_release == 'Yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the three APKs
        uses: actions/download-artifact@v4
        with:
          pattern: telegram-accessible-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release with the APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_description }}
        run: |
          set -e
          ls -l dist
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG="v${GITHUB_RUN_NUMBER}"
          fi
          TITLE="$RELEASE_TITLE"
          if [ -z "$TITLE" ]; then
            if [ -n "$RELEASE_TAG" ]; then TITLE="$RELEASE_TAG"; else TITLE="Release v${GITHUB_RUN_NUMBER}"; fi
          fi
          # a typed \n becomes a real new line
          NOTES="${RELEASE_NOTES//\\n/$'\n'}"
          if [ -z "$NOTES" ]; then
            NOTES="Automatic build release."$'\n\n'"Which file? arm64-v8a: most phones made from about 2017 on. armeabi-v7a: older 32-bit phones. universal: works on every phone (bigger file)."
          fi
          FILES=()
          DEBUG=""
          for NAME in universal arm64-v8a armeabi-v7a; do
            SRC="dist/telegram-accessible-${NAME}.apk"
            if [ ! -f "$SRC" ]; then
              echo "ERROR: $SRC is missing"
              exit 1
            fi
            OUT="telegram-accessible-${TAG}-${NAME}.apk"
            cp "$SRC" "$OUT"
            FILES+=("$OUT")
            if grep -q debug "dist/variant-${NAME}.txt" 2>/dev/null; then
              DEBUG="$DEBUG $NAME"
            fi
          done
          EXTRA=()
          if [ -n "$DEBUG" ]; then
            NOTES="$NOTES"$'\n\n'"Note: the release build failed for:$DEBUG, so those APKs are debug builds."
            EXTRA+=(--prerelease)
          fi
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            "${EXTRA[@]}"
          URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Release created: $URL"
          echo "Release created: $URL" >> "$GITHUB_STEP_SUMMARY"
